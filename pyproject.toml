[project]
name = "retrait-gonflement"
version = "0.1.0"
description = "Le marché immobilier applique-t-il une décote aux maisons exposées au retrait-gonflement des argiles ?"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Uniquement ce que lit l'app déployée
dependencies = [
    "streamlit>=1.40",
    "pydeck>=0.9",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = ["pytest>=8"]
# Collecte, traitement et modèle : local uniquement
pipeline = [
    "httpx>=0.28.1",
    "duckdb>=1.1",
    "pyfixest>=0.25",
]

[tool.uv]
# Installés par `uv sync` ; l'app déployée n'utilise que les dépendances principales
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrait_gonflement"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]   # les tests importent donnees, textes (modules de app/)
