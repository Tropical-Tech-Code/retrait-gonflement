# Périmètre, URL et seuils du projet. Lu par les connecteurs et le pipeline.
# Une URL vide = source non confirmée : le connecteur correspondant refuse de télécharger.

[perimetre]
departements = ["31", "47", "77", "82"]
annee_debut = 2021
annee_fin = 2025   # années civiles complètes

[sources.dvf]
# {annee} et {departement} sont remplacés par le connecteur
url = "https://files.data.gouv.fr/geo-dvf/latest/csv/{annee}/departements/{departement}.csv.gz"

# Cartes RGA : dépôt manuel (pas d'URL stable, formulaire Géorisques). Le connecteur ne
# télécharge rien : il vérifie la présence et la validité des fichiers.
# Procédure : télécharger à la main le Shapefile Lambert 93 de chaque département du
# périmètre sur Géorisques, puis le déposer SANS le renommer ni le décompresser dans
# data/raw/rga/<millésime>/. `fichier` donne le nom attendu ({departement} est remplacé).
# Un `fichier` vide = source pas encore trouvée.
# Carte 2020 : page « retrait-gonflement des argiles, version 2020 » de Géorisques.
[sources.rga_2020]
fichier = "AleaRG{departement}_L93.zip"   # dépôt dans data/raw/rga/2020/

[sources.rga_2026]
fichier = "AleaRG_2025_{departement}_L93.zip"   # dépôt dans data/raw/rga/2026/

[sources.gaspar]
# Archive ZIP de 8 tables (data.gouv.fr, URL stable)
url = "https://www.data.gouv.fr/api/1/datasets/r/d6fb9e18-b66b-499c-8284-46a3595579cc"
table = "catnat_gaspar_*.csv"        # le nom change à chaque publication (date)
libelle_risque = "Sécheresse"        # valeur de lib_risque_jo à retenir (filtrage au jour 2)

[sources.communes]
# API Géo, un GeoJSON par département
url = "https://geo.api.gouv.fr/departements/{departement}/communes?format=geojson&geometry=contour&fields=code,nom"

[nettoyage]
surface_bati_min = 20          # m²
surface_bati_max = 400         # m²
valeur_fonciere_min = 15000    # €
percentile_exclu = 0.01        # 1 % bas et 1 % haut du prix/m², par département et par année
distance_limite_zone_m = 50    # robustesse : ventes proches d'une limite de zone

[estimation]
min_ventes_fort = 15
min_ventes_faible_moyen = 15
min_ventes_total = 50
seuil_prix_median = 5          # ventes minimales pour publier un prix médian
niveau_ic = 0.95
seuil_pas_de_decote = -0.03    # borne basse de l'IC au-dessus de −3 % => « pas de décote »

[carte]
tolerance_simplification_m = 50
decimales_coordonnees = 5
# Bornes des cinq classes de prime (en fraction) : < -0,10 ; -0,10 à -0,03 ; -0,03 à 0,03 ; 0,03 à 0,10 ; > 0,10
classes_prime = [-0.10, -0.03, 0.03, 0.10]
